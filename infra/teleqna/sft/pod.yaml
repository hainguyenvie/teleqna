apiVersion: v1
kind: Pod
metadata:
  name: teleqna-sft
  namespace: tensara
  labels:
    app: teleqna-sft
    owner: h2n
spec:
  restartPolicy: Never
  nodeName: hgx046
  containers:
    - name: main
      image: pytorch/pytorch:2.8.0-cuda12.8-cudnn9-devel
      command: ["/bin/bash", "-c"]
      args:
        - |
          set -u
          ROOT=/workspace/teleqna-sft
          mkdir -p "$ROOT/jobs" "$ROOT/done" "$ROOT/results" "$ROOT/models"
          chmod -R 0777 "$ROOT/jobs" "$ROOT/done" "$ROOT/results" "$ROOT/models" 2>/dev/null || true
          echo "runner up $(date -Iseconds) $(hostname)"
          nvidia-smi -L || true
          while true; do
            for job in "$ROOT"/jobs/*.sh; do
              [ -e "$job" ] || continue
              name=$(basename "$job" .sh)
              mv "$job" "$ROOT/done/$name.running" || continue
              setsid bash "$ROOT/done/$name.running" > "$ROOT/done/$name.log" 2>&1 &
              pid=$!
              while kill -0 "$pid" 2>/dev/null; do
                if [ -e "$ROOT/done/$name.kill" ]; then
                  kill -- -"$pid" 2>/dev/null || true
                  sleep 2
                  kill -9 -- -"$pid" 2>/dev/null || true
                  rm -f "$ROOT/done/$name.kill"
                fi
                sleep 5
              done
              wait "$pid"
              rc=$?
              mv "$ROOT/done/$name.running" "$ROOT/done/$name.rc$rc"
              chmod -R 0777 "$ROOT/done" "$ROOT/results" "$ROOT/models" 2>/dev/null || true
            done
            sleep 5
          done
      resources:
        requests:
          cpu: "16"
          memory: 64Gi
          nvidia.com/gpu: "1"
        limits:
          cpu: "32"
          memory: 128Gi
          nvidia.com/gpu: "1"
      env:
        - name: TORCH_CUDA_ARCH_LIST
          value: "9.0"
        - name: HF_HUB_OFFLINE
          value: "1"
        - name: HF_DATASETS_OFFLINE
          value: "1"
        - name: TOKENIZERS_PARALLELISM
          value: "false"
        - name: PYTORCH_CUDA_ALLOC_CONF
          value: expandable_segments:True
      volumeMounts:
        - name: project
          mountPath: /workspace/teleqna-sft
        - name: telelogs-base
          mountPath: /workspace/telelogs-base
          readOnly: true
        - name: shm
          mountPath: /dev/shm
  volumes:
    - name: project
      hostPath:
        path: /mnt/registry/tensara-home/projects/telelogs/runs/teleqna-sft
        type: DirectoryOrCreate
    - name: telelogs-base
      hostPath:
        path: /mnt/registry/tensara-home/projects/telelogs
        type: Directory
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: 32Gi
